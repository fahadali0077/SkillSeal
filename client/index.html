<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ─────────────────────────────────────────────────────── -->
  <title>SkillSeal — Verify Skills & Hire Verified Talent</title>
  <meta name="description"
    content="SkillSeal lets you verify skills online with AI-powered assessments. Candidates prove their technical expertise and earn a verified badge. Recruiters hire proven talent — not self-reported claims." />
  <meta name="keywords"
    content="verify skills, verify my skills, skill verification, skills test online, verified skills, prove your skills, skill assessment platform, hire verified developers, verified candidate, technical skill test, AI skill assessment, coding skill verification, developer assessment, skills certification, hire proven talent, skill badge, verify technical skills, online skills verification, skill verification platform" />
  <meta name="author" content="SkillSeal" />
  <link rel="canonical" href="https://www.skillseal.tech/" />

  <!-- Google site verification (add your actual code from Search Console) -->

  <!-- ── Logo hint for Google ───────────────────────────────────────────── -->

  <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.skillseal.tech/" />
  <meta property="og:site_name" content="SkillSeal" />
  <meta property="og:title" content="SkillSeal — Verify Skills & Hire Verified Talent" />
  <meta property="og:description"
    content="Verify your technical skills with AI-powered assessments. Earn a verified badge recruiters trust. No more self-reported claims." />
  <meta property="og:image" content="https://www.skillseal.tech/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SkillSeal — Verify Skills for Proven Hiring" />
  <meta property="og:locale" content="en_US" />

  <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@skillseal" />
  <meta name="twitter:title" content="SkillSeal — Verify Skills & Hire Verified Talent" />
  <meta name="twitter:description"
    content="Verify your technical skills with AI assessments. Earn a badge. Get hired." />
  <meta name="twitter:image" content="https://www.skillseal.tech/og-image.png" />

  <!-- ── Typefaces ──────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <!-- ── Favicon ────────────────────────────────────────────────────────── -->
  <!-- SVG favicon (modern browsers) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- PNG fallbacks — Vite will copy these from /public -->
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Web app manifest (tells Chrome/Android to use the logo) -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#12233A" />
  <meta name="msapplication-TileColor" content="#12233A" />

  <!-- ── Robots ─────────────────────────────────────────────────────────── -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />

  <!-- ── Fonts ──────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ── JSON-LD Structured Data ────────────────────────────────────────── -->
  <!--
    This block tells Google:
    1. Who we are (Organization) — used for the Knowledge Panel logo
    2. What our site is (WebSite) — enables the search box sitelink
    3. Our key navigation pages (SiteNavigationElement) — hints at sitelinks
    4. What our product does (SoftwareApplication) — rich results
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [

      {
        "@type": "Organization",
        "@id": "https://www.skillseal.tech/#organization",
        "name": "SkillSeal",
        "url": "https://www.skillseal.tech",
        "sameAs": [],
        "logo": {
          "@type": "ImageObject",
          "@id": "https://www.skillseal.tech/#logo",
          "url": "https://www.skillseal.tech/favicon.svg",
          "contentUrl": "https://www.skillseal.tech/favicon.svg",
          "width": 512,
          "height": 512,
          "caption": "SkillSeal"
        },
        "image": { "@id": "https://www.skillseal.tech/#logo" },
        "description": "SkillSeal is an AI-powered skill verification platform. Candidates verify skills and earn trusted badges. Recruiters hire proven developers, not guesses.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@skillseal.tech"
        }
      },

      {
        "@type": "WebSite",
        "@id": "https://www.skillseal.tech/#website",
        "url": "https://www.skillseal.tech",
        "name": "SkillSeal",
        "description": "Verify Skills. Hire Proven Talent.",
        "publisher": { "@id": "https://www.skillseal.tech/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.skillseal.tech/jobs?keyword={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": "en-US"
      },

      {
        "@type": "WebPage",
        "@id": "https://www.skillseal.tech/#webpage",
        "url": "https://www.skillseal.tech/",
        "name": "SkillSeal — Verify Skills & Hire Verified Talent",
        "isPartOf": { "@id": "https://www.skillseal.tech/#website" },
        "about": { "@id": "https://www.skillseal.tech/#organization" },
        "description": "Verify your technical skills with AI-powered assessments. Earn a verified badge. Help recruiters hire proven talent.",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.skillseal.tech/" }
          ]
        }
      },

      {
        "@type": "SoftwareApplication",
        "name": "SkillSeal",
        "url": "https://www.skillseal.tech",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI-powered skill verification platform. Candidates take proctored technical assessments and earn verifiable badges. Recruiters search proven, verified talent.",
        "keywords": "verify skills, skill verification platform, hire verified developers, technical assessment, AI skill test",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free to start. Verify your first skill at no cost.",
          "url": "https://www.skillseal.tech/pricing"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": "1"
        },
        "publisher": { "@id": "https://www.skillseal.tech/#organization" }
      },

      {
        "@type": "SiteNavigationElement",
        "name": "Verify Your Skills",
        "url": "https://www.skillseal.tech/register?role=candidate&redirect=/assessment",
        "description": "Take an AI-powered skill assessment and earn a verified badge. Free to start."
      },
      {
        "@type": "SiteNavigationElement",
        "name": "Hire Verified Talent",
        "url": "https://www.skillseal.tech/register?role=recruiter",
        "description": "Search candidates who have proven their technical skills. Filter by score and tier."
      },
      {
        "@type": "SiteNavigationElement",
        "name": "Sign In",
        "url": "https://www.skillseal.tech/login",
        "description": "Sign in to your SkillSeal account."
      },
      {
        "@type": "SiteNavigationElement",
        "name": "Create Free Account",
        "url": "https://www.skillseal.tech/register",
        "description": "Create a free SkillSeal account as a candidate or recruiter."
      },
      {
        "@type": "SiteNavigationElement",
        "name": "Browse Verified Jobs",
        "url": "https://www.skillseal.tech/jobs",
        "description": "Find jobs where employers value verified skills."
      },
      {
        "@type": "SiteNavigationElement",
        "name": "Pricing",
        "url": "https://www.skillseal.tech/pricing",
        "description": "Simple, transparent pricing for SkillSeal plans."
      }

    ]
  }
  </script>

  <!-- ── Security ───────────────────────────────────────────────────────── -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
