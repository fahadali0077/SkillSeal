<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>SkillSeal — Verified Skills for Proven Hiring</title>
  <meta name="description"
    content="SkillSeal verifies candidate skills through AI-powered contextual assessments. Recruiters hire with confidence. Candidates prove their expertise with a Seal." />
  <meta name="keywords"
    content="skill verification, verified skills, candidate assessment, proven hire, skill certification, recruiter tools, hire developers, technical assessment" />
  <meta name="author" content="SkillSeal" />
  <link rel="canonical" href="https://" />

  <!-- Open Graph (LinkedIn, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://skillseal.tech" />
  <meta property="og:site_name" content="SkillSeal" />
  <meta property="og:title" content="SkillSeal — Verified Skills for Proven Hiring" />
  <meta property="og:description"
    content="Stop guessing. SkillSeal verifies candidate skills through AI-powered assessments so recruiters can hire proven talent with confidence." />
  <meta property="og:image" content="https://skillseal.tech/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@skillseal" />
  <meta name="twitter:title" content="SkillSeal — Verified Skills for Proven Hiring" />
  <meta name="twitter:description"
    content="Stop guessing. SkillSeal verifies candidate skills through AI-powered assessments so recruiters can hire proven talent with confidence." />
  <meta name="twitter:image" content="https://skillseal.tech/og-image.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="theme-color" content="#0a66c2" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com blob:; connect-src 'self' https://skillseal-fc5f.onrender.com wss://skillseal-fc5f.onrender.com https://sentry.io; object-src 'none';" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "SkillSeal",
          "url": "https://skillseal.tech",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "AI-powered skill verification platform for recruiters and HR teams. Candidates earn verified Seals; recruiters hire proven talent.",
          "offers": {
            "@type": "Offer",
            "category": "SaaS",
            "url": "https://skillseal.tech/pricing"
          },
          "publisher": {
            "@type": "Organization",
            "name": "SkillSeal",
            "url": "https://skillseal.tech",
            "logo": {
              "@type": "ImageObject",
              "url": "https://skillseal.tech/logo.png"
            }
          }
        },
        {
          "@type": "WebSite",
          "url": "https://skillseal.tech",
          "name": "SkillSeal",
          "description": "Verified Skills for Proven Hiring",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://skillseal.tech/jobs?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
</head>

<body>
  <div id="root"></div>
