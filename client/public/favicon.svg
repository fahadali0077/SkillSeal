<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SkillSeal">
  <title>SkillSeal</title>
  <!-- The mark at favicon scale: the rim is dropped below 24px, leaving the
       struck serif S on a solid oxblood disc. -->
  <circle cx="256" cy="256" r="256" fill="#8A1F2F"/>
  <text
    x="256" y="268"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#FBF9F6"
    font-family="Newsreader, Georgia, 'Times New Roman', serif"
    font-weight="500"
    font-size="300"
    letter-spacing="-3">S</text>
</svg>
